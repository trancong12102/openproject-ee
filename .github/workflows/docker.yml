name: Build & push Docker image

# Build on PRs (validate the Dockerfile builds), build + push on main, and manual
# runs. Image tags mirror the OpenProject tag pinned in the Dockerfile: stable
# tags get rolled-up aliases (17.4.0 / 17.4 / 17 / latest), pre-release tags are
# published under their exact name only (e.g. 17.6-rc, dev). Pushes to GHCR with
# the built-in GITHUB_TOKEN.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ghcr.io/trancong12102/openproject-ee

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Skipped on PRs (no push → no login needed).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mirror OpenProject's tag scheme: read the pinned tag from the Dockerfile
      # base image (strip the "openproject:" prefix and "-slim" suffix). A stable
      # X.Y.Z tag (17.4.0) also gets minor/major/latest aliases; a pre-release tag
      # (17.6-rc, dev) is published under its exact name only.
      - name: Extract base OpenProject tag
        id: base
        run: |
          base_tag="$(grep -oE 'openproject:[A-Za-z0-9._-]+-slim' Dockerfile | head -1 | sed -E 's/^openproject://; s/-slim$//')"
          if [ -z "$base_tag" ]; then
            echo "::error::Could not parse OpenProject base tag from Dockerfile" && exit 1
          fi
          echo "tag=$base_tag" >> "$GITHUB_OUTPUT"   # 17.4.0 | 17.6-rc | dev
          if printf '%s' "$base_tag" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            {
              echo "stable=true"
              echo "minor=${base_tag%.*}"  # 17.4
              echo "major=${base_tag%%.*}" # 17
            } >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The exact base tag is always pushed on the default branch (17.4.0 or
          # 17.6-rc); the minor/major/latest rollups are reserved for stable tags
          # so they never point at a pre-release.
          tags: |
            type=raw,value=${{ steps.base.outputs.tag }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ steps.base.outputs.minor }},enable=${{ steps.base.outputs.stable == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ steps.base.outputs.major }},enable=${{ steps.base.outputs.stable == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=latest,enable=${{ steps.base.outputs.stable == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # avoid the "unknown/unknown" arch entry GHCR shows
          # Single-arch (amd64) — the base slim image is built for amd64.
          # For arm64 too: add docker/setup-qemu-action@v4 above and set:
          # platforms: linux/amd64,linux/arm64
